    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
  </style>
</head>
<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ================================================================

  { id:"CH-02",       name:"Chiller 2",       type:"Chiller",  loc:"Rooftop",    cap:350, capUnit:"RT", status:"running", load:65, kw:228,  cop:3.1, baseCop:3.8, alarm:true,  lastPM:"2026-01-20", pmInterval:90  },
  { id:"CH-03",       name:"Chiller 3",       type:"Chiller",  loc:"Rooftop",    cap:150, capUnit:"RT", status:"standby", load:0,  kw:0,    cop:null,baseCop:3.7, alarm:false, lastPM:"2026-02-10", pmInterval:90  },
  { id:"AHU-GF-01",   name:"AHU GF-01",       type:"AHU",      loc:"Ground Fl.", cap:15,  capUnit:"kW", status:"running", load:72, kw:10.8, cop:null,baseCop:null,alarm:false, lastPM:"2026-03-01", pmInterval:60  },
  { id:"AHU-L1-01",   name:"AHU L1-01",       type:"AHU",      loc:"Lantai 1",   cap:18,  capUnit:"kW", status:"running", load:80, kw:14.4, cop:null,baseCop:null,alarm:false, lastPM:"2026-03-01", pmInterval:60  },
  { id:"AHU-L2-01",   name:"AHU L2-01",       type:"AHU",      loc:"Lantai 2",   cap:18,  capUnit:"kW", status:"running", load:85, kw:15.3, cop:null,baseCop:null,alarm:false, lastPM:"2026-04-01", pmInterval:60  },

  { id:"PUMP-CHW-01", name:"CHW Pump 1",       type:"Pump",     loc:"Basement 1", cap:22,  capUnit:"kW", status:"running", load:85, kw:18.7, cop:null,baseCop:null,alarm:false, lastPM:"2026-03-01", pmInterval:90  },
  { id:"PUMP-CHW-02", name:"CHW Pump 2",       type:"Pump",     loc:"Basement 1", cap:22,  capUnit:"kW", status:"standby", load:0,  kw:0,    cop:null,baseCop:null,alarm:false, lastPM:"2026-03-01", pmInterval:90  },
  { id:"PUMP-CW-01",  name:"CW Pump 1",        type:"Pump",     loc:"Rooftop",    cap:30,  capUnit:"kW", status:"running", load:82, kw:24.6, cop:null,baseCop:null,alarm:false, lastPM:"2026-03-01", pmInterval:90  },
  { id:"PUMP-DOM-01", name:"Dom. Water Pump",  type:"Pump",     loc:"Basement 1", cap:5.5, capUnit:"kW", status:"running", load:95, kw:5.2,  cop:null,baseCop:null,alarm:true,  lastPM:"2026-04-01", pmInterval:60  },
  { id:"LIFT-01",     name:"Lift 1",           type:"Elevator", loc:"Core",       cap:null,capUnit:"kW", status:"running", load:null,kw:8.5, cop:null,baseCop:null,alarm:false, lastPM:"2026-04-15", pmInterval:30  },
  { id:"LIFT-02",     name:"Lift 2",           type:"Elevator", loc:"Core",       cap:null,capUnit:"kW", status:"running", load:null,kw:8.5, cop:null,baseCop:null,alarm:false, lastPM:"2026-04-15", pmInterval:30  }
];

const ANOMALIES = [
  {
    id:"ANO-001", sev:"HIGH", status:"open",
    title:"AHU L3-01: Beroperasi di Luar Jam Kerja",
    asset:"AHU-L3-01", loc:"Lantai 3", detected:"29 Apr 2026 · 06:15",
    wasteKwh:33.6, wasteIdr:48720,
    desc:"AHU L3-01 beroperasi selama 8 jam di luar jam kerja (22:00–06:00). Tidak ada jadwal aktif dan tidak ada aktivitas terdeteksi di lantai 3 pada periode tersebut.",
    action:"Verifikasi konfigurasi schedule BMS untuk AHU-L3-01. Aktifkan occupancy-based shutdown. Tambahkan timer interlock untuk after-hours."
  },
  {
    id:"ANO-002", sev:"HIGH", status:"open",
    title:"Chiller 2: Degradasi COP Signifikan (−18.4%)",
    asset:"CH-02", loc:"Rooftop", detected:"28 Apr 2026 · 14:00",
    wasteKwh:180, wasteIdr:261000,
    desc:"COP Chiller-2 saat ini 3.1 vs baseline 3.8 (penurunan 18.4%). Pada kondisi beban 65% dan ambient normal, ini mengindikasikan fouling pada heat exchanger kondenser atau kebocoran refrigeran bertahap.",
    action:"Jadwalkan inspeksi dan pembersihan kondenser segera. Periksa tekanan refrigeran. Pertimbangkan shifting beban ke Chiller-1 sampai perbaikan selesai."
  },
  {
    id:"ANO-003", sev:"MEDIUM", status:"open",
    title:"Dom. Water Pump: Operasi Kontinyu Tanpa Demand Jelas",
    asset:"PUMP-DOM-01", loc:"Basement 1", detected:"29 Apr 2026 · 08:00",
    wasteKwh:10.4, wasteIdr:15080,
    desc:"Pompa air domestik beroperasi terus-menerus pada load 95% tanpa indikasi demand yang membenarkan. Kemungkinan: pressure switch gagal atau ada kebocoran pada sistem distribusi air gedung.",
    action:"Periksa pressure switch dan tekanan sistem. Lakukan inspeksi kebocoran pada jalur distribusi air. Cek flow meter jika tersedia."
  },
  {
    id:"ANO-004", sev:"LOW", status:"investigating",
    title:"MDP-L2: Beban Tercatat Saat Akhir Pekan",
    asset:"MDP-L2", loc:"Lantai 2", detected:"26 Apr 2026 · 10:00",
    wasteKwh:14.0, wasteIdr:20300,
    desc:"Panel MDP-L2 mencatat beban ~14 kW pada hari Sabtu (08:00–18:00). Kemungkinan sumber: sirkuit pencahayaan yang tidak termatikan otomatis atau peralatan tertentu tidak terjadwal OFF.",
    action:"Audit manual sirkuit pencahayaan L2 untuk akhir pekan. Pertimbangkan penambahan timer relay atau occupancy sensor pada sirkuit utama."
  }
];

const ENPI = {
  current: 13.1, baseline: 13.8, target: 12.5,
  trend: [
    { m:"Okt '25", v:14.2 }, { m:"Nov '25", v:13.9 }, { m:"Des '25", v:12.8 },
    { m:"Jan '26", v:13.5 }, { m:"Feb '26", v:13.2 }, { m:"Mar '26", v:13.0 },
    { m:"Apr '26", v:13.1 }
  ]
};

const SEU = [
  { id:"SEU-01", name:"HVAC & Cooling",       share:52, mwh:93.6,  icon:"ph-fill ph-wind",                color:"bg-blue-500",    pot:"HIGH",   savePct:12 },
  { id:"SEU-02", name:"Lighting",              share:15, mwh:27.0,  icon:"ph-fill ph-sun-horizon",         color:"bg-yellow-400",  pot:"MEDIUM", savePct:18 },
  { id:"SEU-03", name:"Server Room / ICT",    share:13, mwh:23.4,  icon:"ph-fill ph-hard-drives",         color:"bg-purple-500",  pot:"LOW",    savePct:5  },
  { id:"SEU-04", name:"Office Equipment",     share:8,  mwh:14.4,  icon:"ph-fill ph-monitor",             color:"bg-orange-400",  pot:"MEDIUM", savePct:10 },
  { id:"SEU-05", name:"Elevators & Pumps",    share:5,  mwh:9.0,   icon:"ph-fill ph-elevator",            color:"bg-emerald-500", pot:"LOW",    savePct:8  },
  { id:"SEU-06", name:"Others",               share:7,  mwh:12.6,  icon:"ph-fill ph-dots-three-circle",   color:"bg-slate-400",   pot:"LOW",    savePct:5  }
];

const MONTHLY = [
  { m:"Okt '25", kwh:188200, days:23 }, { m:"Nov '25", kwh:182500, days:21 },
  { m:"Des '25", kwh:160200, days:18 }, { m:"Jan '26", kwh:185400, days:22 },
  { m:"Feb '26", kwh:174600, days:20 }, { m:"Mar '26", kwh:179800, days:21 },
  { m:"Apr '26", kwh:163750, days:19 }
];

const HOURLY = Array.from({length:24},(_,h)=>{
  const work = h>=7&&h<=18, peak = h>=9&&h<=16;
  const base = work?(peak?420:310):140;
  return { h:String(h).padStart(2,'0')+":00", kw:Math.max(120,Math.round(base+Math.sin(h*2.3)*14)) };
});

/* ================================================================
   SHARED UI PRIMITIVES
   ================================================================ */

const StatusDot = ({status}) => {
  const c = {running:"bg-emerald-400",standby:"bg-amber-400",trip:"bg-red-500"}[status]||"bg-slate-400";
  const lbl = {running:"Running",standby:"Standby",trip:"Trip"}[status]||status;
  return (
    <span className={`inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full border ${
      status==="running"?"bg-emerald-50 border-emerald-200 text-emerald-700":
      status==="standby"?"bg-amber-50 border-amber-200 text-amber-700":
      "bg-red-50 border-red-200 text-red-700"}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${c} ${status==="running"?"pulse":""}`}></span>{lbl}
    </span>
  );
};

const SevBadge = ({sev}) => (
  <span className={`text-xs font-bold px-2 py-0.5 rounded border ${
    sev==="HIGH"?"bg-red-100 border-red-300 text-red-700":
    sev==="MEDIUM"?"bg-amber-100 border-amber-300 text-amber-700":
    "bg-blue-100 border-blue-300 text-blue-700"}`}>{sev}</span>
);

const KCard = ({title, val, unit, sub, icon, color="blue", trend}) => {
  const C = {
    blue: "bg-blue-50 border-blue-100 text-blue-700",
    green:"bg-emerald-50 border-emerald-100 text-emerald-700",
    amber:"bg-amber-50 border-amber-100 text-amber-700",
    red:  "bg-red-50 border-red-100 text-red-700",
    slate:"bg-slate-50 border-slate-200 text-slate-700"
  }[color];
  return (
    <div className={`card-hover border rounded-xl p-5 ${C}`}>
      <div className="flex justify-between items-start mb-2">
        <p className="text-xs font-medium text-slate-500 leading-snug">{title}</p>
        <i className={`${icon} text-xl opacity-60`}></i>
      </div>
      <div className="flex items-baseline gap-1">
        <span className="text-2xl font-bold">{val}</span>
        {unit && <span className="text-sm font-medium text-slate-400">{unit}</span>}
      </div>
      {sub && <p className="text-xs text-slate-400 mt-0.5">{sub}</p>}
      {trend!==undefined && (
        <p className={`text-xs font-semibold mt-1.5 flex items-center gap-1 ${trend<0?"text-emerald-600":"text-red-500"}`}>
          <i className={`ph-bold ${trend<0?"ph-trend-down":"ph-trend-up"}`}></i>
          {Math.abs(trend)}% vs baseline
        </p>
      )}
    </div>
  );
};

const SecHead = ({title, sub}) => (
  <div className="mb-5">
    <h2 className="text-lg font-bold text-slate-900">{title}</h2>
    {sub && <p className="text-sm text-slate-500 mt-0.5">{sub}</p>}
  </div>
);

/* ================================================================
   PLATFORM TABS
   ================================================================ */

/* --- TAB 1: OVERVIEW ------------------------------------------ */
const Overview = () => {
  const totalKw = FLOORS.reduce((s,f)=>s+f.kw,0);
  const todayKwh = HOURLY.slice(0,15).reduce((s,h)=>s+h.kw,0);
  const openCount = ANOMALIES.filter(a=>a.status!=="resolved").length;
  const enpiDev = (((ENPI.current-ENPI.baseline)/ENPI.baseline)*100).toFixed(1);

  return (
    <div className="space-y-7">
      {/* Site banner */}
      <div className="rounded-2xl bg-gradient-to-r from-slate-900 to-blue-900 text-white p-6 flex flex-col sm:flex-row justify-between gap-4">
        <div>
          <div className="flex items-center gap-2 mb-1">
            <span className="w-2 h-2 bg-green-400 rounded-full pulse"></span>
            <span className="text-xs font-bold text-green-400 uppercase tracking-widest">BEMS Connected — Live Data</span>
          </div>
          <h1 className="text-2xl font-bold">{SITE.name}</h1>
          <p className="text-blue-200 text-sm">{SITE.location} · {SITE.type} · {SITE.area.toLocaleString()} m²</p>
        </div>
        <div className="text-right shrink-0">
          <p className="text-xs text-slate-400">Last sync</p>
          <p className="font-mono text-sm text-blue-200">{SITE.lastSync}</p>
          <p className="text-xs text-slate-400 mt-1">Tarif: {SITE.tariff} · Rp {SITE.rateKwh}/kWh</p>
        </div>
      </div>

      {/* KPI row */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KCard title="Beban Aktual" val={totalKw} unit="kW" sub="14:32 WIB — seluruh lantai" icon="ph-fill ph-lightning" color="blue" />
        <KCard title="Konsumsi Hari Ini" val={(todayKwh/1000).toFixed(1)} unit="MWh" sub="Est. akhir hari: 4.2 MWh" icon="ph-fill ph-chart-bar" color="slate" trend={parseFloat(enpiDev)} />
        <KCard title="Biaya Est. Bulan Ini" val={"Rp " + (163750*SITE.rateKwh/1000000).toFixed(0)+"Jt"} unit="" sub="Apr 2026 · 19 hari kerja" icon="ph-fill ph-currency-circle-dollar" color="green" />
        <KCard title="Anomali Aktif" val={openCount} unit="alerts" sub="2 HIGH · 1 MEDIUM · 1 LOW" icon="ph-fill ph-warning" color={openCount>0?"red":"green"} />
      </div>

      <div className="grid lg:grid-cols-2 gap-6">
        {/* Floor breakdown */}
        <div className="bg-white rounded-xl border border-slate-200 p-6">
          <SecHead title="Beban per Lantai / Zone" sub="Real-time (kW) dari panel MDP BEMS" />
          <div className="space-y-2.5">
            {FLOORS.map(f => {
              const pct = Math.round((f.kw/100)*100);
              const bc = f.kw>=70?"bg-red-400":f.kw>=50?"bg-amber-400":"bg-blue-400";
              return (
                <div key={f.id} className="flex items-center gap-3">
                  <span className="w-8 text-right text-xs font-mono font-bold text-slate-400 shrink-0">{f.id}</span>
                  <div className="flex-1 bg-slate-100 rounded-full h-6 overflow-hidden relative">
                    <div className={`h-full ${bc} bar rounded-full`} style={{width:`${pct}%`}}></div>
                    <span className="absolute inset-0 flex items-center pl-2 text-xs font-semibold text-white" style={{textShadow:"0 1px 2px rgba(0,0,0,.4)"}}>{f.label}</span>
                  </div>
                  <span className="w-12 text-right text-sm font-bold text-slate-700 shrink-0">{f.kw} kW</span>
                </div>
              );
            })}
            <div className="flex justify-between items-center pt-3 border-t border-slate-100 mt-1">
              <span className="text-sm text-slate-500 font-medium">Total Building Load</span>
              <span className="text-lg font-bold text-blue-700">{totalKw} kW</span>
            </div>
          </div>
        </div>

        <div className="space-y-4">
          {/* Hourly bar chart */}
          <div className="bg-white rounded-xl border border-slate-200 p-6">
            <SecHead title="Tren Beban Hari Ini (kW/jam)" sub="Simulasi data BEMS · biru = jam kerja" />
            <div className="flex items-end gap-0.5 h-24">
              {HOURLY.map(h => {
                const work = parseInt(h.h)>=7 && parseInt(h.h)<=18;
                const pct = Math.round((h.kw/460)*100);
                return (
                  <div key={h.h} className="flex-1 flex items-end justify-center" title={`${h.h}: ${h.kw} kW`}>
                    <div className={`w-full rounded-t ${work?"bg-blue-400":"bg-slate-300"}`} style={{height:`${pct}%`}}></div>
                  </div>
                );
              })}
            </div>
            <div className="flex justify-between text-[10px] text-slate-400 mt-1.5">
              <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span>
            </div>
          </div>

          {/* EnPI snapshot */}
          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold text-slate-900">EnPI Snapshot — Apr 2026</h3>
              <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${parseFloat(enpiDev)<0?"bg-emerald-100 text-emerald-700":"bg-red-100 text-red-600"}`}>
                {enpiDev}% vs baseline
              </span>
            </div>
            {[
              {label:"Aktual",   val:ENPI.current,  pct:Math.round((ENPI.current/ENPI.baseline)*100),  color:"bg-blue-400"},
              {label:"Baseline", val:ENPI.baseline, pct:100,                                            color:"bg-slate-300"},
              {label:"Target",   val:ENPI.target,   pct:Math.round((ENPI.target/ENPI.baseline)*100),   color:"bg-emerald-400"}
            ].map(r=>(
              <div key={r.label} className="mb-2">
                <div className="flex justify-between text-xs mb-0.5">
                  <span className="text-slate-500">{r.label}</span>
                  <span className="font-bold text-slate-700">{r.val} kWh/m²</span>
                </div>
                <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
                  <div className={`h-full ${r.color} bar rounded-full`} style={{width:`${r.pct}%`}}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Active anomalies */}
      <div className="bg-white rounded-xl border border-slate-200 p-6">
        <SecHead title="Anomali & Alert Aktif" sub="Temuan berpotensi waste yang membutuhkan tindakan" />
        <div className="space-y-3">
          {ANOMALIES.filter(a=>a.status!=="resolved").map(a=>(
            <div key={a.id} className={`flex items-start gap-4 p-4 rounded-xl border ${
              a.sev==="HIGH"?"bg-red-50 border-red-200":a.sev==="MEDIUM"?"bg-amber-50 border-amber-200":"bg-blue-50 border-blue-200"}`}>
              <i className={`ph-fill ph-warning text-xl mt-0.5 shrink-0 ${a.sev==="HIGH"?"text-red-500":a.sev==="MEDIUM"?"text-amber-500":"text-blue-500"}`}></i>
              <div className="flex-1 min-w-0">
                <div className="flex flex-wrap items-center gap-2 mb-0.5">
                  <SevBadge sev={a.sev}/>
                  <span className="font-bold text-slate-800 text-sm">{a.title}</span>
                </div>
                <p className="text-xs text-slate-500">{a.loc} · Detected: {a.detected}</p>
                <p className="text-xs font-semibold text-red-600 mt-0.5">Est. waste: {a.wasteKwh} kWh → Rp {a.wasteIdr.toLocaleString()}</p>
              </div>
              <StatusDot status={a.status==="investigating"?"standby":"running"}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* --- TAB 2: SEU ANALYSIS -------------------------------------- */
const SEUPage = () => {
  const totalMwh = SEU.reduce((s,x)=>s+x.mwh,0);
  const totalSaveMwh = SEU.reduce((s,x)=>s+(x.mwh*x.savePct/100),0);

  return (
    <div className="space-y-7">
      <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 flex gap-3">
        <i className="ph-fill ph-info text-blue-500 text-xl mt-0.5 shrink-0"></i>
        <div>
          <p className="font-bold text-blue-900">Significant Energy Use (SEU) — ISO 50001</p>

/* --- TAB 4: ASSET MONITOR ------------------------------------- */
const AssetPage = () => {
  const NOW = new Date("2026-04-29");
  const daysSince = d => Math.floor((NOW - new Date(d))/(1000*60*60*24));
  const pmStatus = a => {
    const r = daysSince(a.lastPM)/a.pmInterval;
    return r>=1.1?{cls:"text-red-600",label:"Overdue",bg:"bg-red-50 border-red-200"}
          :r>=0.85?{cls:"text-amber-600",label:"Due Soon",bg:"bg-amber-50 border-amber-200"}
          :{cls:"text-emerald-600",label:"OK",bg:"bg-emerald-50 border-emerald-200"};
  };

  const Card = ({a}) => {
    const pm = pmStatus(a);
    return (
      <div className={`bg-white rounded-xl border p-4 card-hover ${a.alarm?"border-red-300":"border-slate-200"}`}>
        <div className="flex justify-between items-start mb-3">
          <div>
            <p className="font-bold text-slate-900 text-sm">{a.name}</p>
            <p className="text-xs text-slate-400">{a.id} · {a.loc}</p>
          </div>
          <div className="flex flex-col items-end gap-1">
            <StatusDot status={a.status}/>
            {a.alarm && <span className="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-1.5 py-0.5 rounded flex items-center gap-1"><i className="ph-bold ph-bell-ringing"></i>ALARM</span>}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-2 text-xs mb-3">
          <div className="bg-slate-50 rounded-lg p-2.5">
            <p className="text-slate-400">Power</p>
            <p className="font-bold text-slate-800">{a.kw} kW</p>
          </div>
          {a.load!==null && (
            <div className="bg-slate-50 rounded-lg p-2.5">
              <p className="text-slate-400">Load</p>
              <p className={`font-bold ${a.load>=90?"text-red-600":a.load>=75?"text-amber-600":"text-slate-800"}`}>{a.load}%</p>
            </div>
          )}
          {a.cop && (
            <div className={`col-span-2 rounded-lg p-2.5 ${a.cop<a.baseCop*0.9?"bg-red-50":"bg-slate-50"}`}>
              <p className="text-slate-400">COP</p>
              <p className={`font-bold ${a.cop<a.baseCop*0.9?"text-red-600":"text-slate-800"}`}>
                {a.cop} <span className="text-slate-400 font-normal">(base: {a.baseCop})</span>
                {a.cop<a.baseCop*0.9&&<span className="text-red-500 ml-1">↓{(((a.baseCop-a.cop)/a.baseCop)*100).toFixed(0)}%</span>}
              </p>
            </div>
          )}
        </div>
        <div className={`flex items-center justify-between text-xs px-3 py-2 rounded-lg border ${pm.bg}`}>
          <span className="text-slate-500">PM: {daysSince(a.lastPM)} hari lalu</span>
          <span className={`font-bold ${pm.cls}`}>{pm.label}</span>
        </div>
      </div>
    );
  };

  const chillers = ASSETS.filter(a=>a.type==="Chiller");
  const ahus = ASSETS.filter(a=>a.type==="AHU");
  const pumps = ASSETS.filter(a=>a.type==="Pump");
  const lifts = ASSETS.filter(a=>a.type==="Elevator");

  return (
    <div className="space-y-8">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KCard title="Total Aset Dipantau" val={ASSETS.length} unit="aset" sub="BEMS Gedung AMDI" icon="ph-fill ph-stack" color="blue"/>
        <KCard title="Running" val={ASSETS.filter(a=>a.status==="running").length} unit="aset" sub={`${ASSETS.filter(a=>a.status==="standby").length} standby`} icon="ph-fill ph-play-circle" color="green"/>
        <KCard title="Active Alarms" val={ASSETS.filter(a=>a.alarm).length} unit="aset" sub="Perlu pengecekan" icon="ph-fill ph-bell-ringing" color="red"/>
        <KCard title="Total Power" val={ASSETS.reduce((s,a)=>s+a.kw,0).toFixed(0)} unit="kW" sub="Seluruh aset termonitor" icon="ph-fill ph-lightning" color="slate"/>
      </div>

      <div>
        <SecHead title="Cooling System — Chillers" sub="SEU utama — 52% total konsumsi · 3 unit"/>
        <div className="grid md:grid-cols-3 gap-4">{chillers.map(a=><Card key={a.id} a={a}/>)}</div>
      </div>
      <div>
        <SecHead title="Air Handling Units (AHU)" sub="Distribusi udara dingin per lantai"/>
        <div className="grid md:grid-cols-3 gap-4">{ahus.map(a=><Card key={a.id} a={a}/>)}</div>
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <div><SecHead title="Pumps" sub="CHW, CW, dan air domestik"/><div className="space-y-3">{pumps.map(a=><Card key={a.id} a={a}/>)}</div></div>
        <div><SecHead title="Elevators" sub="Lift gedung"/><div className="space-y-3">{lifts.map(a=><Card key={a.id} a={a}/>)}</div></div>
      </div>
    </div>
  );
};
